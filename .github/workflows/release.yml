name: Enterprise Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Production Binary
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 📥 Install Dependencies
        run: pnpm install

      - name: ⚡ Download Electron Binary
        run: node node_modules/electron/install.js

      - name: 🚀 Compile TypeScript & Package Electron Executable
        run: pnpm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Generate SHA-256 Checksums for Integrity Verification
        shell: powershell
        run: |
          Get-ChildItem -Path release/*.exe, release/*.blockmap, release/latest.yml -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath release/SHA256SUMS.txt -Append -Encoding ascii
          }

      - name: 📝 Extract Release Notes from CHANGELOG.md
        shell: powershell
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          $notes = ""
          if ($content -match '(?s)## \[' + [regex]::Escape($ver) + '\][^\n]*\n+(.*?)(?=\n## \[|\Z)') {
              $notes = $matches[1].Trim()
          } else {
              $notes = "Production release ${{ github.ref_name }} of Gemini Video Watermark Remover."
          }

          $header = @"
          ## 🚀 Gemini Video Watermark Remover ${{ github.ref_name }}

          ### 📦 What's Changed in this Release

          $notes

          ---
          ### 🔒 Verification & Integrity
          Verify downloaded binaries using `SHA256SUMS.txt` attached below.
          "@

          Set-Content -Path release/NOTES.md -Value $header -Encoding UTF8

      - name: 📣 Create Automated Professional Release Page
        uses: softprops/action-gh-release@v2
        with:
          name: Gemini Video Watermark Remover ${{ github.ref_name }}
          body_path: release/NOTES.md
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
