name: Enterprise Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Production Binary
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 📥 Install Dependencies
        run: pnpm install

      - name: ⚡ Download Electron Binary
        run: node node_modules/electron/install.js

      - name: 🚀 Compile TypeScript & Package Electron Executable
        run: pnpm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Generate SHA-256 Checksums for Integrity Verification
        shell: powershell
        run: |
          Get-ChildItem -Path release/*.exe, release/*.blockmap, release/latest.yml -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath release/SHA256SUMS.txt -Append -Encoding ascii
          }

      - name: 📣 Create Automated Professional Release Page
        uses: softprops/action-gh-release@v2
        with:
          name: Gemini Video Watermark Remover ${{ github.ref_name }}
          body: |
            ## 🚀 Gemini Video Watermark Remover ${{ github.ref_name }}

            First official production release of **Gemini Video Watermark Remover** for desktop.
            Removes Gemini, Google Veo, and AI video watermarks from clips of any length using hardware-accelerated stream processing.

            ### 🎯 Key Mechanics & Features
            - **Streamed FFmpeg Execution**: Constant ~50MB RAM footprint for videos of any duration.
            - **AI Auto-Detection**: Instant keyframe probing & automatic watermark ROI box placement.
            - **Visually Lossless Output (`-crf 16`)**: Pristine video clarity with bit-for-bit audio passthrough (`-c:a copy`).
            - **Hardware Acceleration**: Auto-detects NVIDIA NVENC and Intel QuickSync GPU encoders.
            - **Multi-Video Batch Queue**: Queue multiple video files for sequential processing.

            ---
            ### 📜 Automatically Generated Changelog
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
